name: APK Android

# Gera um APK instalável (sem conta Expo) a cada push na main.
# O APK fica sempre no mesmo link:
# https://github.com/nascyther-jpg/Hacker-Invader/releases/latest/download/black-node.apk
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Gera a pasta android/ a partir do app.json (CNG)
      - run: npx expo prebuild --platform android --no-install
        env:
          CI: 1

      # Release assinado com a keystore de debug do template: instala direto
      # e as atualizações instalam por cima. Não serve para a Play Store.
      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Renomear APK
        run: cp android/app/build/outputs/apk/release/app-release.apk black-node.apk

      - uses: actions/upload-artifact@v4
        with:
          name: black-node-apk
          path: black-node.apk

      - name: Publicar Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${{ github.run_number }}"
          gh release create "$TAG" black-node.apk \
            --target "${{ github.sha }}" \
            --title "Black Node — build ${{ github.run_number }}" \
            --notes "APK gerado do commit ${GITHUB_SHA::7}. Baixe black-node.apk no celular Android e instale." \
            --latest
